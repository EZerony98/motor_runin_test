[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-runin-test"
version = "0.1.0"
description = "PySide6 host application for motor run-in testing"
readme = "README.md"
requires-python = ">=3.9,<3.10"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["drivers*", "models*", "services*", "ui*", "utils*", "workers*"]
exclude = ["tests*"]

[tool.pyright]
pythonVersion = "3.9"
include = ["main.py", "drivers", "models", "services", "ui", "utils", "workers"]
